name: Deploy dbt documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  doc-dbt:
    runs-on: generate-document
    steps:
      - name: Build project
        run: dbt build --profiles-dir .

      - name: Generate documentation
        run: dbt docs generate --profiles-dir .

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: target

  deploy:
    needs: doc-dbt
    runs-on: generate-document
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
